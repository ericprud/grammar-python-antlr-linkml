[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "PyShexC"
description = "PyShExC - Python ShEx compiler"
authors = [
    { name = "Eric Prudman", email = "eric@uu3.org"},
    { name = "Harold Solbrig", email = "solbrig@jhu.edu" },
    { name = "Wouter-Michiel Vierdag", email = "michiel.vierdag@scverse.org" }
]
license = { text = "MIT License" }
repository = "https://github.com/linkml/grammar-python-antlr-linkml"
readme = "README.md"
keywords = [
    "shex",
    "shexc",
    "shexj",
    "shexr",
    "rdf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "antlr4-python3-runtime~=4.13.2",
    "chardet>=7.4.1",
    "jsonasobj>=1.2.1",
    "pyjsg>=0.11.10",
    "rdflib-shim>=1.0.3",
    "shexjsg>=0.8.1",
]

[tool.uv.sources]
# pyjsg with antlr4-python3-runtime moved to a compiler extra (linkml/pyjsg#52);
# repoint to PyPI once released
pyjsg = { git = "https://github.com/ericprud/pyjsg.git", branch = "antlr-extra" }

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["pyshexc"]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "pytest>=9.0.3",
    "requests>=2.33.1",
    "yadict-compare>=1.2.0",
]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313",  "py314"]

[tool.codespell]
skip = [
  ".git",
  "uv.lock",
  "*.toml",
]

[tool.tox]
requires = ["tox>=4"]
env_list = ["lint", "py{310,311,312,313}"]

[tool.tox.env_run_base]
allowlist_externals = ["uv"]
deps = ["pytest"]
commands = [
  ["uv", "sync", "--all-extras", "--dev"],
  ["uv", "run", "pytest", "{posargs}"],
]

[tool.tox.env.codespell]
description = "Run spell checkers."
skip_install = true
deps = [
  "codespell",
  "tomli", # required for getting config from pyproject.toml
]
commands = [
  ["codespell", "{posargs}"]
]
